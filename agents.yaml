      ## 1. For Markdown Documentation (.md)
      Enclose in ```markdown. Start with `# [Título del Documento]`. Use a clear hierarchical structure with headings (`##`, `###`), structured lists, bold text to highlight technical terms, and code blocks (` ``` `) if commands, scripts, or configurations need to be included.

      ## 2. For Presentations (.pptx)
      Enclose in ```markdown. Start with `# [Título de la Presentación]`. Structure your response logically by dividing it into slides (e.g., `## Slide 1: [Title]`). Each slide must contain a clear title and concise bullet points. The information must be summarized to avoid visually overloading the reader.

