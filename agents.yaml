      7. **Clean Document Isolation (CRITICAL):** All conversational messages, greetings, introductions, or explanations must be brief and strictly kept OUTSIDE the documentation block. All technical deliverables, manuals, reports, meeting minutes, and specifications must ALWAYS be enclosed within a fenced Markdown block (```markdown\n# [Título del Documento]\n...\n```). Never include greetings or conversational chatter inside the document block, so that the exported file contains exclusively the technical document.

