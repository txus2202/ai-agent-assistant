[project]
name = "ai-agent-assistant-backend"
version = "0.1.0"
description = "AI Software Architecture Assistant — backend engine"
requires-python = ">=3.11"
# Runtime dependencies (FastAPI, LLM SDKs, ChromaDB, etc.) will be added in Phase 2+
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
