[project]
name = "ai-agent-assistant-backend"
version = "0.1.0"
description = "AI Software Architecture Assistant — backend engine"
requires-python = ">=3.11"
# Runtime dependencies (FastAPI, LLM SDKs, ChromaDB, etc.) will be added in Phase 2+
dependencies = [
    "certifi>=2026.10.1",
    "chromadb==1.5.9",
    "sentence-transformers==6.0.1",
    "PyYAML==6.0.3",
    "google-genai==2.28.0",
    "openai==3.24.0",
    "anthropic==1.11.0",
    "PyMuPDF==2.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    "faster-whisper==1.2.1",
    "kokoro-onnx==0.4.7",
    "soundfile==0.14.0",
    "vosk==0.3.44",
    "langfuse==2.60.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
