[project]
name = "ai-agent-assistant-backend"
version = "0.1.0"
description = "AI Software Architecture Assistant — backend engine"
requires-python = ">=3.12"
# Runtime dependencies (FastAPI, LLM SDKs, ChromaDB, etc.) will be added in Phase 2+
dependencies = [
    "aiofiles==25.1.0",
    "aiohttp>=3.14.5",
    "anthropic==1.11.0",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4==4.15.0",
    "certifi>=2026.10.23",
    "chromadb==1.5.9",
    "fastapi==0.142.2",
    "faster-whisper==1.2.1",
    "filelock>=4.2.9",
    "google-genai==2.28.0",
    "httpx==0.28.1",
    "kokoro-onnx==0.4.7",
    "langfuse==2.60.10",
    "multidict>=7.2.1",
    "oauthlib>=4.0.1",
    "openai==3.24.0",
    "opentelemetry-api>=1.45.2",
    "pyasn1>=0.6.5",
    "pydantic-settings==2.15.0",
    "PyJWT>=2.15.1",
    "PyMuPDF==1.28.2",
    "python-multipart==0.0.33",
    "PyYAML==6.0.3",
    "sentence-transformers==6.0.1",
    "setuptools>=84.2.1",
    "soundfile==0.14.0",
    "soupsieve>=4.0.1",
    "torch>=2.15.0",
    "urllib3>=2.8.0",
    "uvicorn[standard]==0.52.4",
    "vosk==0.3.44",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

