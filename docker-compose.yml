# =============================================================================
# ATENEA — Multi-Agent Architecture with Docker Compose Profiles
# =============================================================================
# Profiles available:
#   (default / no profile) : Starts core local stack (backend + frontend)
#   --profile local        : Starts core local stack (backend + frontend)
#   --profile scale        : Starts backend + frontend + external Chroma Server + Postgres + Redis
#   --profile observability: Starts self-hosted Langfuse telemetry stack
#   --profile full         : Starts complete enterprise stack (app + scale + observability)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Core Application Stack (Local & Production-ready)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atenea-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    networks:
      - app-net
      - data-net
    volumes:
      - ./obsidian_vault:/app/obsidian_vault
      - atenea_data:/app/data
      - ./agents.yaml:/app/agents.yaml:ro
      - ./topology.yaml:/app/topology.yaml:ro
      - ./backend/voices:/app/voices
      - ./backend/src/infrastructure/models/vosk:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MALLOC_ARENA_MAX=2
      - WHISPER_BEAM_SIZE=1
      - WHISPER_THREADS=4
      - KOKORO_OMP_NUM_THREADS=${KOKORO_OMP_NUM_THREADS:-4}
      - VAULT_ROOT=/app/obsidian_vault
      - SQLITE_DB_PATH=/app/data/atenea.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - CHROMA_HOST=${CHROMA_HOST:-}
      - CHROMA_PORT=8000
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-0.30}
      - REVIEW_ROUNDS=${REVIEW_ROUNDS:-1}
      - MAX_LEARN_FILE_MB=${MAX_LEARN_FILE_MB:-50}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-europe-west1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-gemini}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-3.6-flash}
      - IMAGE_GENERATION_PROVIDER=${IMAGE_GENERATION_PROVIDER:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:4173"]}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_DASHBOARD_URL=${LANGFUSE_DASHBOARD_URL:-http://localhost:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_METRICS_ENABLED=${LANGFUSE_METRICS_ENABLED:-false}
      # --- Phase 7: Authentication & Security ---
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env (e.g. openssl rand -base64 48)}
      - AUTH_TOKEN_EXPIRY_SECONDS=${AUTH_TOKEN_EXPIRY_SECONDS:-28800}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-atenea_session}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - AUTH_DELETE_STRATEGY=${AUTH_DELETE_STRATEGY:-soft}
      - INITIAL_SETUP_TOKEN=${INITIAL_SETUP_TOKEN:-}
      - AUTH_TRUST_X_FORWARDED_FOR=${AUTH_TRUST_X_FORWARDED_FOR:-true}
      - AUTH_RATE_LIMIT_LOGIN_ATTEMPTS=${AUTH_RATE_LIMIT_LOGIN_ATTEMPTS:-5}
      - AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS=${AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      - AUTH_RATE_LIMIT_SETUP_ATTEMPTS=${AUTH_RATE_LIMIT_SETUP_ATTEMPTS:-3}
      - AUTH_RATE_LIMIT_SETUP_WINDOW_SECONDS=${AUTH_RATE_LIMIT_SETUP_WINDOW_SECONDS:-60}
      - DATABASE_URL=${DATABASE_URL:-}
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atenea-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - npm-network
      - app-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Scaled Infrastructure (Activated via --profile scale or --profile full)
  # ---------------------------------------------------------------------------
  chroma-server:
    image: chromadb/chroma:latest
    container_name: atenea-chroma-server
    profiles:
      - scale
      - full
    restart: unless-stopped
    ports:
      - "${CHROMA_BIND_IP:-127.0.0.1}:${CHROMA_HOST_PORT:-8001}:8000"
    security_opt:
      - no-new-privileges:true
    networks:
      - data-net
    volumes:
      - atenea_chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: atenea-postgres
    profiles:
      - scale
      - observability
      - full
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    security_opt:
      - no-new-privileges:true
    networks:
      - data-net
    volumes:
      - atenea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: atenea-redis
    profiles:
      - scale
      - observability
      - full
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    security_opt:
      - no-new-privileges:true
    networks:
      - data-net
    volumes:
      - atenea_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Langfuse Observability Stack (Phase 6 / ADR 020)
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:3
    container_name: atenea-langfuse-web
    profiles:
      - observability
      - full
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${LANGFUSE_BIND_IP:-127.0.0.1}:${LANGFUSE_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    networks:
      - npm-network
      - app-net
      - data-net
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1536"
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-postgres}}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      SALT: ${SALT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:3
    container_name: atenea-langfuse-worker
    profiles:
      - observability
      - full
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - data-net
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1024"
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-postgres}}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      SALT: ${SALT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    deploy:
      resources:
        limits:
          memory: 1024M

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: atenea-langfuse-clickhouse
    profiles:
      - observability
      - full
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "test -n \"$$CLICKHOUSE_PASSWORD\" || { echo 'CLICKHOUSE_PASSWORD must be set in .env' >&2; exit 1; }; exec /entrypoint.sh"]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_BIND_IP:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_BIND_IP:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    security_opt:
      - no-new-privileges:true
    networks:
      - data-net
    volumes:
      - atenea_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: atenea-langfuse-minio
    profiles:
      - observability
      - full
    restart: unless-stopped
    entrypoint: sh
    command: -c 'test -n "$$MINIO_ROOT_PASSWORD" || { echo "MINIO_ROOT_PASSWORD must be set in .env" >&2; exit 1; }; mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${MINIO_API_BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9090}:9000"
      - "${MINIO_CONSOLE_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9091}:9001"
    security_opt:
      - no-new-privileges:true
    networks:
      - data-net
    volumes:
      - atenea_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  atenea_data:
  atenea_chroma_data:
  atenea_postgres_data:
  atenea_clickhouse_data:
  atenea_redis_data:
  atenea_minio_data:

networks:
  # Network for Nginx Proxy Manager integration
  # By default creates or connects to the bridge network used by NPM
  npm-network:
    name: ${NPM_NETWORK:-npm-network}
    external: ${NPM_NETWORK_EXTERNAL:-false}

  # Application internal network (Frontend <-> Backend)
  app-net:
    driver: bridge

  # Data tier internal network (Backend <-> Databases & Storage)
  # Isolated with internal: true so no external traffic or outbound leaks are possible
  data-net:
    driver: bridge
    internal: true
