# =============================================================================
# ATENEA Multi-Agent Debate Topology
# =============================================================================
# This configuration file defines the assignment of specialized AI agents to
# the abstract functional slots in the ATENEA architectural debate workflow.
#
# Constraints:
# - The agent assigned to 'supervisor' MUST have is_supervisor=True in its profile.
# - All agent names must match a registered SubAgentProfile display_name.
# - All other slots accept 0 to N agents (empty lists skip that phase).
# - Default Phase 2 peer-review rounds are set via 'review_rounds' below (0..5),
#   and may be overridden globally via REVIEW_ROUNDS in .env or per operator in the UI.
# =============================================================================

version: "2.0"
project_name: "A.T.E.N.E.A."
project_description: "Asistente Técnica y Evaluadora de Nuevas Estructuras y Arquitecturas"

# Main strategic orchestrator (strictly 1:1, must be an agent with is_supervisor=True)
supervisor: "Atenea"

# Default number of Phase 2 peer-review critique iterations (0..5)
review_rounds: 1

# Phase 1: Natural Language Requirement Formalization (0..N)
interpreters:
  - "Hermes"

# Phase 2: Architecture Solution Proposers & Peer Review (0..N)
proposers:
  - "Ícaro"
  - "Hestia"

reviewers:
  - "Sphinx"

# Phase 3: Architectural Audit & Verdict (0..N)
evaluators:
  - "Sphinx"

# Phase 4: Technical Implementation, Diagramming & DevSecOps (0..N)
implementers:
  - "Aracne"
  - "Hefesto"
